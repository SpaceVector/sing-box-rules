name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NO_SKIP: "true"
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            sing-geoip/go.sum
            sing-geosite/go.sum

      - name: Build geosite
        id: build_geosite
        run: |
          cd sing-geosite
          go run -v .

      - name: Build geoip
        id: build_geoip
        run: |
          cd sing-geoip
          go run -v .

      - name: Release rule sets
        run: .github/release-rule-set.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current time
        id: time
        run: echo "time=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.time.outputs.time }}" \
            ./sing-geosite/geosite.db \
            ./sing-geosite/geosite-cn.db \
            ./sing-geoip/geoip.db \
            ./sing-geoip/geoip-cn.db \
            --title "${{ steps.time.outputs.time }}" \
            --notes "Daily rule update."

      - name: Delete old releases
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: releases } = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 100,
            });
            const oldReleases = releases
              .filter((release) => !release.draft && !release.prerelease)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(5);
            for (const release of oldReleases) {
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id,
              });
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `tags/${release.tag_name}`,
                });
              } catch (error) {
                if (error.status !== 404 && error.status !== 422) {
                  throw error;
                }
              }
            }
